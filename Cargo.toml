toml = "1"
urlencoding = "2"

[dependencies.clap]
features = ["derive"]
version = "4"

[dependencies.reqwest]
features = ["json"]
version = "0.13"

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.tokio]
